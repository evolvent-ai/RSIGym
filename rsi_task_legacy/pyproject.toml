[project]
name = "rsi-task"
version = "0.1.0"
description = "The RSI tasks: task definitions, the launch script, and per-task audits."
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.1.1",
    "tiktoken>=0.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
